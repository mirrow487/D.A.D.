<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D.A.D. — Digital Archive Department</title>
<meta name="description" content="Internal retrieval terminal for the Digital Archive Department.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230f0f11'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='16' fill='%23d6d3c9' text-anchor='middle'%3ED%3C/text%3E%3Crect x='24' y='24' width='6' height='6' fill='%238a2323'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/css/main.css">
<!-- staging note: /admin/ build excluded from public nav per deployment checklist -->
</head>
<body>
<main>
  <div class="landing">
    <div class="landing-mark">DAD</div>
    <div class="landing-title">DIGITAL ARCHIVE DEPARTMENT</div>
    <div class="landing-boot" id="boot-text"></div>

    <form class="clearance-form" id="clearance-form" style="display:none;">
      <label for="clearance-input">CLEARANCE CODE REQUIRED</label>
      <input type="password" id="clearance-input" autocomplete="off" spellcheck="false">
      <button type="submit" class="landing-enter ready" style="cursor:pointer;">AUTHENTICATE</button>
      <div class="clearance-error" id="clearance-error"></div>
    </form>

    <a class="landing-enter" id="enter-link" href="/archive.html" style="display:none;">ENTER ARCHIVE</a>

    <div class="landing-foot">TERMINAL PUBLIC-ACCESS-04 &mdash; RETRIEVAL INTERFACE v2.3<br>UNAUTHORIZED ACCESS IS LOGGED</div>
  </div>
</main>

<script src="/assets/js/effects.js"></script>
<script src="/assets/js/gate.js"></script>
<script>
  var params = new URLSearchParams(window.location.search);
  var returnTo = params.get("return") || "/archive.html";

  var lines = [
    "> initializing retrieval interface...",
    "> connecting to archive index... OK",
    "> terminal: PUBLIC-ACCESS-04",
    "> clearance level: UNVERIFIED",
    "> loading record index..."
  ];
  var bootEl = document.getElementById("boot-text");
  var enterLink = document.getElementById("enter-link");
  var clearanceForm = document.getElementById("clearance-form");
  var clearanceInput = document.getElementById("clearance-input");
  var clearanceError = document.getElementById("clearance-error");

  enterLink.setAttribute("href", returnTo);

  function typeLines(i) {
    if (i >= lines.length) {
      revealNext();
      return;
    }
    var lineEl = document.createElement("div");
    bootEl.appendChild(lineEl);
    DADEffects.typeInto(lineEl, lines[i], 14, function () {
      setTimeout(function () { typeLines(i + 1); }, 180);
    });
  }

  function revealNext() {
    if (DADGate.isCleared()) {
      enterLink.style.display = "";
    } else {
      clearanceForm.style.display = "flex";
      clearanceInput.focus();
    }
  }

  clearanceForm.addEventListener("submit", function (e) {
    e.preventDefault();
    if (DADGate.verify(clearanceInput.value)) {
      DADGate.grant();
      clearanceError.textContent = "";
      clearanceForm.querySelector("label").textContent = "ACCESS GRANTED";
      setTimeout(function () { window.location.href = returnTo; }, 500);
    } else {
      clearanceError.textContent = "ACCESS DENIED — INVALID CLEARANCE CODE";
      clearanceInput.value = "";
      clearanceInput.focus();
    }
  });

  typeLines(0);
</script>
</body>
</html>
